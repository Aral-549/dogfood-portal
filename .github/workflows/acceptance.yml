name: acceptance

# Runs the official DOGFOOD checker (run.py, unmodified) against a clean
# docker compose portal on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Official checker against a fresh portal
        run: ./scripts/check.sh
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report.txt
