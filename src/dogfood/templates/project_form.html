{% extends "base.html" %}
{% block title %}{{ "Edit" if p else "Submit" }} project{% endblock %}
{% block content %}
<h1>{{ "Edit project" if p else "Submit a project" }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ '/projects/' ~ p.id ~ '/edit' if p else '/projects/new' }}" class="card">
  <p><label>Title<br><input name="title" required maxlength="200" value="{{ p.title if p else '' }}"></label></p>
  <p><label>Summary<br><textarea name="summary" rows="3" cols="60">{{ p.summary if p else '' }}</textarea></label></p>
  <p><label>Repository URL<br><input name="repo_url" type="url" value="{{ p.repo_url if p else '' }}"></label></p>
  <p><label>Track<br><select name="track_id"><option value="">None</option>
    {% for t in tracks %}<option value="{{ t.id }}" {% if p and p.track_id == t.id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}
  </select></label></p>
  <p><label><input type="checkbox" name="draft" value="1" {% if p and p.status == 'draft' %}checked{% endif %}> Save as draft</label></p>
  <button>Save</button>
</form>
{% endblock %}
