{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<h1>Set your password</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/set-password/{{ token }}" class="card">
  <p><label>Password (8+ characters)<br><input name="password" type="password" minlength="8" required></label></p>
  <button>Save</button>
</form>
{% endblock %}
