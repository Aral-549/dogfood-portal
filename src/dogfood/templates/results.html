{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block content %}
<h1>Results</h1>
<div class="table-wrap"><table>
<tr><th>Rank</th><th>Project</th><th>Team</th><th>Track</th><th>Reviews</th></tr>
{% for r in results %}<tr><td>{{ r.rank }}</td><td><a href="/projects/{{ r.project }}">{{ meta[r.project].title }}</a></td><td>{{ meta[r.project].team }}</td><td>{{ meta[r.project].track }}</td><td>{{ r.n_reviews }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
