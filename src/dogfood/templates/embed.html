<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ event.name if event else "Gallery" }}</title>
<style>
:root { --fg:#1b1b1b; --muted:#666; --bg:#fff; --line:#e3e1da; --accent:#2c5f8a; }
@media (prefers-color-scheme: dark) { :root { --fg:#ecebe6; --muted:#a3a19a; --bg:#151514; --line:#34332f; --accent:#8db6da; } }
body { margin:0; padding:.75rem; font:14px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:.6rem; }
.card { border:1px solid var(--line); border-radius:8px; padding:.7rem; }
h3 { margin:0 0 .3rem; font-size:1rem; } a { color:var(--accent); } .muted { color:var(--muted); font-size:.85em; }
</style></head>
<body>
{% if event %}<p class="muted">{{ event.name }} &middot; {{ items|length }} projects</p>{% endif %}
<div class="grid">
{% for p in items %}<div class="card"><h3><a href="/projects/{{ p.id }}" target="_blank" rel="noopener">{{ p.title }}</a></h3>
<p>{{ p.summary }}</p><p class="muted">{{ p.team }} &middot; {{ p.track or "No track" }}</p></div>
{% else %}<p>No projects yet.</p>{% endfor %}
</div>
</body></html>
