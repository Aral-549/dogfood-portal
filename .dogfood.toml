# .dogfood.toml - read by run.py. Tokens are printed by the portal at boot (demo mode).

[portal]
base_url = "http://localhost:8080"

[tiers]
# T1 and T2 are machine-verified by run.py; T3 and T4 are judged by hand (the kickoff brief),
# so run.py reports them as "claimed but not verified". scripts/check.sh fails only on T1/T2.
claimed = ["T1", "T2", "T3", "T4"]
pitch = "A self-hosted hackathon portal with backend-enforced role isolation and documented per-judge z-score normalization."

[auth]
organizer   = "Authorization: Bearer demo-organizer"
judge_a     = "Authorization: Bearer demo-judge-a"
judge_b     = "Authorization: Bearer demo-judge-b"
participant = "Authorization: Bearer demo-participant"

[routes]
gallery      = "/projects"
submit       = "/api/projects"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judges/jdg_24/scores"
csv_export   = "/api/export.csv"
